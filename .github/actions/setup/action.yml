name: Set up a goofi build
description: The toolchains, the caches and `goofi-init`, the same on every runner.
runs:
  using: composite
  steps:
    # cpal's Linux hosts link system libraries; lavapipe is the GPU the graphics scenario renders on.
    - if: runner.os == 'Linux'
      shell: bash
      run: >
        sudo apt-get update -q && sudo apt-get install -y --no-install-recommends
        libasound2-dev libpipewire-0.3-dev libjack-jackd2-dev libdbus-1-dev mesa-vulkan-drivers ffmpeg

    - uses: actions/setup-node@v7
      with:
        node-version: '24'

    # The bundles' packages, keyed on the requirement files goofi-init installs from.
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: node-bundles/*/requirements*.txt

    # rustup reads rust-toolchain.toml. sccache keeps every compiled crate, ours included, which a
    # target-dir cache never does; rust-cache keeps only the registry here.
    - uses: mozilla-actions/sccache-action@v0.0.9
    - uses: Swatinem/rust-cache@v2
      with:
        cache-targets: false

    # bindgen finds no libclang on its own here; asio-sys needs the same path.
    - if: runner.os == 'Windows'
      shell: bash
      run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

    # The shipped nodes and the Python probes, built into the binary and read back at boot.
    # Restored here, saved by the job's last step, so a red run still warms the next one.
    - uses: actions/cache/restore@v4
      with:
        path: target/goofi-build
        key: goofi-build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: goofi-build-${{ runner.os }}-

    - name: Provision (cargo run -p goofi-init)
      shell: bash
      run: cargo run -p goofi-init
