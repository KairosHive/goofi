name: CI

on:
  push:
  workflow_dispatch:

# A newer push to the same branch replaces the run under way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # sccache keeps every compiled crate across runs; incremental compilation would split them.
  CARGO_INCREMENTAL: 0
  # The test profile declares `incremental = false`; dev must say the same, or the two profiles'
  # units share one uplifted cdylib and rebuild six crates after each other on every step.
  CARGO_PROFILE_DEV_INCREMENTAL: 'false'
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'
  # Where the bridge's build script puts the shipped nodes, so the harness and the fleet share it.
  GOOFI_BUILD_DIR: ${{ github.workspace }}/target/goofi-build

jobs:
  # One job, one build: every gate in the order a fresh clone meets them.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - name: Zero warnings (rustc + clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Cargo's own warnings are not clippy's; the test profile is what the tests below link.
      - name: No cargo warnings
        run: |
          cargo test --workspace --no-run 2>&1 | tee build.log
          ! grep -n '^warning' build.log
      # One boot fills the node build dir with the Python probes every test binary would otherwise take.
      - run: cargo run -p goofi-cli -- --headless --list-nodes
      # One invocation over the whole workspace, so the package set and its unified features match
      # the builds above and nothing is compiled a second time.
      - name: Unit tests and the situations with a binary of their own
        run: cargo test --workspace --no-fail-fast --lib --bins --test agent --test audio --test cli --test probe --test shipped
      # One situation FILE per process, four threads each: a file's situations share the runner
      # alone, so lavapipe's shader compiles and the Python children are not starved by the rest,
      # and an hour-long process is not what the last file inherits. The flag, not
      # `RUST_TEST_THREADS`, which the helper children a situation spawns would inherit.
      # The files whose situations all need `embed` run in the Python-tier step below, not here.
      - name: Situations
        run: |
          status=0
          for file in backend/goofi-tests/tests/all/*.rs; do
            situation=$(basename "$file" .rs)
            case $situation in main|codec_golden|filter_golden|param_modulation|python_init_order|python_module_hygiene) continue;; esac
            echo "::group::$situation"
            cargo test -p goofi-tests --test all -- "$situation::" --test-threads=4 || status=1
            echo "::endgroup::"
          done
          exit $status
      # The other Python tier links libpython: only the situations that run Python, and of the
      # graphics ones the three that put Python on the GPU's side.
      - name: Tests (in-process Python tier)
        run: >
          cargo test -p goofi-tests --features embed --test all --
          python:: plugins:: nodes:: inspect:: codec_golden:: filter_golden::
          param_modulation:: python_module_hygiene:: python_init_order::
          graphics::python_texture graphics::host_pixels --test-threads=4
      - run: cargo test -p goofi-tests --features embed --test python_gil_tripwire
      - run: npm install
        working-directory: tests/e2e
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      # One backend: two cookbook patches rendering on lavapipe at once starve each other's frames.
      - run: npm run e2e
        working-directory: tests/e2e
        env:
          GOOFI_E2E_WORKERS: 1
      - run: npm run e2e:plugins
        working-directory: tests/e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: target/goofi-build
          key: goofi-build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

  # Only what a platform can answer differently: processes, paths, dynamic libraries, PTYs, audio
  # hosts. The rest was proven on Linux above.
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo run -p goofi-cli -- --headless --list-nodes
      - name: Unit tests
        run: cargo test --workspace --exclude goofi-tests --no-fail-fast
      # Windows builds and runs the unit tests only: iceoryx2 cannot create a listener under the
      # session's root there yet, and every situation opens one. Drop both conditions once it can.
      - name: Situations
        if: runner.os != 'Windows'
        run: >
          cargo test -p goofi-tests --test all --
          audio_priority:: children:: engines:: headless:: inspect:: io:: logging:: nodes::
          plugins:: python:: session:: transport::
      - if: runner.os != 'Windows'
        run: cargo test -p goofi-tests --no-fail-fast --test agent --test audio --test cli --test probe --test shipped
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: target/goofi-build
          key: goofi-build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
