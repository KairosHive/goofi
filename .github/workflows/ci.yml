name: CI

on:
  push:
  workflow_dispatch:

# A newer push to the same branch replaces the run under way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # sccache keeps every compiled crate across runs; incremental compilation would split them.
  CARGO_INCREMENTAL: 0
  # The test profile declares `incremental = false`; dev must say the same, or the two profiles'
  # units share one uplifted cdylib and rebuild six crates after each other on every step.
  CARGO_PROFILE_DEV_INCREMENTAL: 'false'
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'
  # goofi's runtime, under the workspace so its build caches can be kept across runs.
  GOOFI_RUNTIME: ${{ github.workspace }}/target/goofi-runtime

jobs:
  # One job, one build: every gate in the order a fresh clone meets them. The runner has four
  # cores; the situations run as ONE process at four threads, and the browser suite runs beside
  # them, since a test a sibling can starve is a defect and not a reason to run it alone.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - name: Zero warnings (rustc + clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Cargo's own warnings are not clippy's; the test profile is what the tests below link.
      - name: No cargo warnings
        run: |
          cargo test --workspace --no-run 2>&1 | tee build.log
          ! grep -n '^warning' build.log
      # The browser suite runs BESIDE the situations, its output kept apart and shown after them.
      # `--test-threads=4` as a flag, not `RUST_TEST_THREADS`, which the helper children a
      # situation spawns would inherit. `embed` is goofi-tests' default feature, so the one
      # process holds both Python tiers.
      - name: Situations and the browser suite
        run: |
          (cd tests/e2e && npm run e2e && npm run e2e:plugins) > e2e.log 2>&1 &
          e2e=$!
          status=0
          cargo test --workspace --no-fail-fast --test agent --test audio --test cli --test probe --test shipped || status=1
          cargo test -p goofi-tests --test all -- --test-threads=4 || status=1
          cargo test -p goofi-tests --test python_gil_tripwire || status=1
          wait $e2e || status=1
          echo "::group::Browser suite"
          cat e2e.log
          echo "::endgroup::"
          exit $status
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            target/goofi-runtime/*/build
            target/goofi-runtime/cache/cargo
          key: goofi-runtime-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}

  # Only what a platform can answer differently: processes, paths, dynamic libraries, PTYs, audio
  # hosts. The rest was proven on Linux above.
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Windows only boots: iceoryx2 cannot create a listener under the session's root there yet,
      # and every situation opens one. Drop both conditions once it can.
      - name: Situations
        if: runner.os != 'Windows'
        run: >
          cargo test -p goofi-tests --test all --
          audio_priority:: children:: engines:: headless:: inspect:: io:: logging:: nodes::
          plugins:: python:: session:: transport::
      - if: runner.os != 'Windows'
        run: cargo test -p goofi-tests --no-fail-fast --test agent --test audio --test cli --test probe --test shipped
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            target/goofi-runtime/*/build
            target/goofi-runtime/cache/cargo
          key: goofi-runtime-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}
