name: CI

on:
  push:
  workflow_dispatch:

# A newer push to the same branch replaces the run under way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # sccache keeps every compiled crate across runs; incremental compilation would split them.
  CARGO_INCREMENTAL: 0
  # The test profile declares `incremental = false`; dev must say the same, or the two profiles'
  # units share one uplifted cdylib and rebuild six crates after each other on every step.
  CARGO_PROFILE_DEV_INCREMENTAL: 'false'
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'
  # goofi's runtime, under the workspace so its build caches can be kept across runs.
  GOOFI_RUNTIME: ${{ github.workspace }}/target/goofi-runtime

# Every job is one setup, ONE cargo build, then its gate. A job runs under ten minutes, or it is
# cut. The situations and the browser suite each have a runner of their own: the gate is the
# code, and a test that only fails beside another suite's load tells nobody what broke.
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Zero warnings (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Every situation of the one test binary at four threads, the runner's cores, and the
      # situations that set process-wide state in binaries of their own. `--test-threads` as a
      # flag, not `RUST_TEST_THREADS`, which the helper children a situation spawns would inherit.
      - name: Situations
        run: >
          cargo test --workspace --no-fail-fast
          --test all --test agent --test audio --test cli --test probe --test shipped --test python_gil_tripwire
          -- --test-threads=4

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/cache@v4
        with:
          path: tests/e2e/node_modules
          key: e2e-npm-${{ runner.os }}-${{ hashFiles('tests/e2e/package-lock.json') }}
      - run: npm install
        working-directory: tests/e2e
      - id: playwright
        run: echo "version=$(npx playwright --version)" >> "$GITHUB_OUTPUT"
        working-directory: tests/e2e
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      # The suite against the binary and the frontend built above: one worker per core, each with
      # a backend of its own.
      - name: Browser suite
        run: npm run check && npx playwright test && npx playwright test --config playwright.plugins.config.ts
        working-directory: tests/e2e
        env:
          GOOFI_E2E_WORKERS: 4
      # Where a browser test stopped: Playwright's error context for each failed test.
      - if: failure()
        run: |
          for context in tests/e2e/test-results/*/error-context.md; do
            [ -f "$context" ] || continue
            echo "::group::$context"
            cat "$context"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/

  # Only what a platform can answer differently: processes, paths, dynamic libraries, PTYs, audio
  # hosts. The rest was proven on Linux above.
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Windows only boots, so its build carries no debug info: the PDB is most of an MSVC link.
      # Set here and nowhere else: a profile value set in the environment, even to what Cargo.toml
      # says, is a profile of its own to sccache, and every crate misses.
      - if: runner.os == 'Windows'
        run: echo 'CARGO_PROFILE_DEV_DEBUG=0' >> "$GITHUB_ENV"
      # Windows only boots: the situations are not yet proven there (roadmap/windows-cleanup.md),
      # so it builds the binaries alone. Drop both once a watched run passes.
      - uses: ./.github/actions/setup
        with:
          targets: ${{ matrix.os == 'windows-latest' && '--bins' || '--lib --bins --example plugin_host --test all --test agent --test audio --test cli --test probe --test shipped --test python_gil_tripwire' }}
      # The situations a platform can answer differently: processes and PTYs (children, agent),
      # paths (io, session), dynamic libraries (nodes, plugins, shipped), the Python child
      # (python), the exchange (transport) and the audio host (audio). A filter after `--`
      # reaches every test binary of the command, so the one binary's situations and the
      # binaries of their own run as two commands of one target selection.
      - name: Situations
        if: runner.os != 'Windows'
        run: >
          cargo test --workspace --no-fail-fast --test all -- --test-threads=4
          children:: io:: nodes:: plugins:: python:: session:: transport::
      - if: runner.os != 'Windows'
        run: cargo test --workspace --no-fail-fast --test agent --test audio --test shipped
