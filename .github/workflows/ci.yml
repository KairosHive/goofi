name: CI

on:
  push:
  workflow_dispatch:

# A newer push to the same branch replaces the run under way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # sccache caches whole crates, which incremental compilation would split.
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: 'true'
  # Where the bridge's build script puts the shipped nodes, so the harness and the fleet share it.
  GOOFI_BUILD_DIR: ${{ github.workspace }}/target/goofi-build
  # The runners have four cores; more test threads than that only make the situations miss their deadlines.
  RUST_TEST_THREADS: 4

jobs:
  # The gates with no platform: types, lints, unit tests and the test binaries of their own.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run check
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - name: Zero warnings (rustc + clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Cargo's own warnings are not clippy's; the test profile is what the shards link.
      - name: No cargo warnings
        run: |
          cargo test --workspace --no-run 2>&1 | tee build.log
          ! grep -n '^warning' build.log
      - name: Unit tests
        run: cargo test --workspace --exclude goofi-tests --no-fail-fast

  # The situations that keep a binary of their own.
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo test -p goofi-tests --no-fail-fast --test agent --test audio --test cli --test probe --test shipped
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: target/goofi-build
          key: goofi-build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

  # `tests/all` split four ways by file name, so a new situation lands in a shard by itself.
  situations:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the shipped nodes once
        run: cargo run -p goofi-cli -- --headless --list-nodes
      - name: Shard ${{ matrix.shard }}
        run: |
          filters=$(ls backend/goofi-tests/tests/all/*.rs | grep -v main.rs | awk -v s=${{ matrix.shard }} 'NR % 4 == s' | xargs -n1 basename | sed 's/\.rs$/::/')
          echo "$filters"
          cargo test -p goofi-tests --test all -- $filters
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: target/goofi-build
          key: goofi-build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

  # The other Python tier links libpython: a second build, and only the situations that run Python.
  python-in-process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo run -p goofi-cli -- --headless --list-nodes
      - run: >
          cargo test -p goofi-tests --features embed --test all --
          python:: plugins:: graphics:: nodes:: inspect:: codec_golden:: filter_golden::
          param_modulation:: python_module_hygiene:: python_init_order::
      - run: cargo test -p goofi-tests --features embed --test python_gil_tripwire

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One backend: two cookbook patches rendering on lavapipe at once starve each other's frames.
    env:
      GOOFI_E2E_WORKERS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm install
        working-directory: tests/e2e
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      # The fleet boots against the same build dir, so the nodes and the Python probes are warm.
      - run: cargo run -p goofi-cli -- --headless --list-nodes
      - run: npm run e2e
        working-directory: tests/e2e
      - run: npm run e2e:plugins
        working-directory: tests/e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: target/goofi-build
          key: goofi-build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

  # Only what a platform can answer differently: processes, paths, dynamic libraries, PTYs, audio
  # hosts. The rest was proven on Linux above.
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cargo run -p goofi-cli -- --headless --list-nodes
      - name: Unit tests
        run: cargo test --workspace --exclude goofi-tests --no-fail-fast
      - name: Situations
        run: >
          cargo test -p goofi-tests --test all --
          audio_priority:: children:: engines:: headless:: inspect:: io:: logging:: nodes::
          plugins:: python:: session:: transport::
      - run: cargo test -p goofi-tests --no-fail-fast --test agent --test audio --test cli --test probe --test shipped
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: target/goofi-build
          key: goofi-build-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
