name: Gates

# `main` only, since 2026-09-14: the org pays for Actions minutes. `workflow_dispatch` checks a
# branch before it lands.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# One run at a time, and the next push waits rather than cancels: a group admits one run in
# progress and ONE pending, and a newer run replaces the pending one — so a burst of pushes
# costs the run under way plus one more, on the newest commit, and never a 90-minute build
# cancelled at minute 85 to start over. That is the throttle: a run can start no more often
# than the previous one finishes, which is longer than any timer we would set, and it costs
# nothing while idle, which no timer can. (A wait timer on a deployment environment would wait
# for free, but this plan does not sell that rule; a cron tick that polls bills a minute every
# tick; a runner that sleeps bills every minute it sleeps.)
concurrency:
  group: gates
  cancel-in-progress: false

# `bash` on every machine, so a step written once behaves once: Windows would otherwise run these
# in PowerShell, which spells a pipe, `&&` and a variable differently. The one pwsh step says so.
defaults:
  run:
    shell: bash

# One job, because the gates are one list and they share one machine's worth of setup: the SPA is
# compiled into the binary, so no cargo build here happens without the frontend's dependencies, and
# the e2e suite drives the binary that falls out of the same build.
#
# The steps are also the fresh-clone path, in order — `goofi-init`, then cargo — so a clone that
# needs a third command fails HERE rather than on a contributor's machine.
#
# One job, and the list is the same list — a per-platform gate running a subset would be the
# second spelling this file exists to prevent. The two steps it drops are dropped because they
# provably cannot differ, not to save time; see the orientation. `fail-fast` is off so one
# platform's failure still reports the others'.
#
# It is a MATRIX OF ONE, and that is the only reason the shape survives: Windows and macOS were
# dropped 2026-09-08 because the org ran out of Actions minutes, which is a bill and not a
# judgment about what they were worth. The premise that retired them was this comment's own —
# "standard runners are free on a public repo" — and it stopped being true.
#
# What is no longer covered, so nobody mistakes green for proof: Windows is a whole separate PAL —
# ConPTY, a `cmd` launcher, `\` in every path, a `.pdb` two targets collide on — and every one of
# those defects reached a user's machine before CI ever compiled them. macOS is arm64, so with it
# gone aarch64 is compiled NOWHERE, and pyo3's embedded interpreter never meets dylib or
# codesigning rules. Both are one line away: put them back in `os` when there are minutes for it,
# and expect the first run to be red.
jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # The ceiling a run must fit under; a run past it is stuck, not slow.
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7

    # goofi offers every cpal host the machine runs, and on Linux each one links a system library:
    # ALSA always, then PipeWire, JACK and rtkit's D-Bus. Only Linux needs them — `jack` dlopens on
    # Windows and macOS, and cpal target-gates the rest — so this step stays the Linux one it was.
    # No MIDI here: the runner's Azure kernel is built without sound, so no package can add the
    # sequencer, and the suite proves the no-sequencer answer on this machine instead.
    # `mesa-vulkan-drivers` is lavapipe, the software Vulkan adapter the graphics scenario renders
    # on: the runner has no GPU, and the suite fails rather than skips without an adapter.
    - if: runner.os == 'Linux'
      run: >
        sudo apt-get update -q && sudo apt-get install -y
        libasound2-dev libpipewire-0.3-dev libjack-jackd2-dev libdbus-1-dev mesa-vulkan-drivers

    # 24, not 22: 22 ships npm 10, which resolves this manifest with no lockfile into `Cannot read
    # properties of null (reading 'edgesOut')` and installs nothing; npm 11, what 24 ships, does not.
    - uses: actions/setup-node@v7
      with:
        node-version: '24'

    # `enable-cache` OFF, not merely unkeyed. Its default glob is `uv.lock`/`requirements*.txt`,
    # and this repo has neither — so the key never changes and the cache never invalidates, which
    # GitHub warns about and is right to. What uv downloads here is two interpreters and the wheels
    # the goofi package pulls, a few seconds of a ten-minute run; the provisioning step re-decides
    # every run on purpose, and a cache nothing can invalidate is the one way that stops being true.
    #
    # v7 is the NEWEST moving major this action publishes — it stopped aliasing them after that, so
    # `@v10` is not a ref and the job fails to resolve before a step runs. It is already node24.
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false

    # No toolchain action on purpose: `rust-toolchain.toml` names the version, rustup honours it,
    # and one owner is the whole point — an action pinning `stable` here is how CI came to run a
    # compiler eight releases ahead of the one the code was checked against.
    #
    # The cache is keyed on `Cargo.lock` + the rustc version and is NOT re-saved on an exact key
    # hit, so one bad save is permanent: a run reported `full match: true` and then compiled 168
    # crates — `libc`, `serde`, the whole graph — because the entry it restored had been cleaned
    # down to less than the four cargo invocations below need. `cache-all-crates` keeps the
    # registry whole rather than pruning it to the workspace's direct dependencies, and the
    # `prefix-key` bump is what forces the one fresh save that replaces the bad entry. Moving the
    # key is the only way to re-save; it is a deliberate commit, like moving the toolchain pin.
    # Saved on a red run too: a failing test is the run that most needs the next one to be fast.
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: v1-rust
        cache-all-crates: true
        cache-on-failure: true

    # iceoryx2 builds its OS bindings with bindgen, which finds libclang by itself everywhere but
    # here: the runner ships LLVM and does not name it. asio-sys generates the ASIO binding the same
    # way, so this one line is also what lets the Windows leg compile the only host that reaches an
    # interface past its first stereo pair — and this leg is the ONLY machine that compiles it.
    - name: Name libclang (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

    # SETUP IS ONE COMMAND. It provisions both interpreters, installs the goofi wheel into each,
    # writes the cargo config that points pyo3 at the free-threaded one, and installs the
    # frontend's dependencies — every precondition the cargo steps below have. Deliberately
    # uncached: it re-decides every run, so CI can never inherit the stale-wheel gap a cached venv
    # would carry.
    - name: Provision (cargo run -p goofi-init)
      run: cargo run -p goofi-init

    # Linux only: type checking has no platform. vitest below is a different matter — it WALKS
    # the tree, and a `rel` built with `\` is how three of its guards failed on Windows alone.
    - name: Type-check (svelte-check + tsc strict)
      if: runner.os == 'Linux'
      run: npm run check
      working-directory: frontend

    - name: Unit tests (vitest)
      run: npm run test
      working-directory: frontend

    # `--all-targets` is load-bearing: a plain build never compiles the integration test targets, so
    # a warning there would ship. Clippy carries the rustc lints too, so this one command is both
    # the build-warning gate and the clippy gate — and `-D warnings` is how "…and it prints nothing"
    # becomes something a machine can hold us to.
    - name: Zero warnings (rustc + clippy)
      run: cargo clippy --workspace --all-targets -- -D warnings

    # Clippy carries the rustc lints, but NOT cargo's own — the `.pdb` collision was one of those,
    # and `-D warnings` never saw it. This is the anchored grep AGENTS.md names, which until now
    # was in the list and in no job.
    - name: No cargo warnings
      run: |
        cargo build --workspace --all-targets 2>&1 | tee /tmp/build.log
        ! grep -n '^warning' /tmp/build.log

    - name: Tests
      run: cargo test --workspace --no-fail-fast

    # The other Python tier LINKS libpython, so it is a second build. Only the situations that run
    # Python differ between the tiers; the rest were proven above and are not run twice.
    - name: Tests (in-process Python tier)
      run: >
        cargo test -p goofi-tests --features embed --
        python:: plugins:: graphics:: nodes:: agent:: inspect:: probe:: simulation::
        codec_golden:: filter_golden:: harmonic_geometry:: image_file:: fluxrt::
        upscaling:: upscaling_fluxrt:: bundles_expr:: param_modulation::
        python_gil_tripwire:: python_module_hygiene:: python_init_order::

    # The e2e suite is its own npm package, and not part of building or running goofi — so it is
    # installed here rather than by goofi-init, which provisions what the two setup commands need.
    # Linux only, and the whole e2e tail with it: a browser has no platform, and the half that
    # does — the binary it drives — is what goofi-tests already proves on every runner above.
    - name: Install the e2e suite's dependencies
      if: runner.os == 'Linux'
      run: npm install
      working-directory: tests/e2e

    # Every project is chromium — the touch and tablet ones are device descriptors, not other
    # engines.
    - name: Install Playwright's browser
      if: runner.os == 'Linux'
      run: npx playwright install --with-deps chromium
      working-directory: tests/e2e

    - name: End-to-end (Playwright against the real binary)
      if: runner.os == 'Linux'
      run: npm run e2e
      working-directory: tests/e2e

    - name: End-to-end (plugin SDK with test clocks)
      if: runner.os == 'Linux'
      run: npm run e2e:plugins
      working-directory: tests/e2e

    # The report and the backends' own logs — a failure here is read from both: the assertion says
    # which spec, the log says what the server did.
    - uses: actions/upload-artifact@v7
      if: failure() && runner.os == 'Linux'
      with:
        name: e2e-report-${{ matrix.os }}
        path: |
          tests/e2e/playwright-report/
          tests/e2e/test-results/
