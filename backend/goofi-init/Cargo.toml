[package]
name = "goofi-init"
version.workspace = true
edition.workspace = true
license.workspace = true

# No pyo3, no python: this is the crate that makes a Python build possible, so it must be
# buildable before one is. The layout is where it puts what it provisions.
[dependencies]
goofi-supervisor = { path = "../goofi-supervisor" }
# `demo.toml`, the list of what a public demo withholds.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# The terminal screen goofi and goofi-init draw.
indicatif = "0.18"
console = "0.16"
# The wheel's content key.
sha2 = "0.10"

[[bin]]
name = "goofi-init"
path = "src/main.rs"
