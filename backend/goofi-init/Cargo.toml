[package]
name = "goofi-init"
version.workspace = true
edition.workspace = true
license.workspace = true

# No pyo3, no python: this is the crate that makes a Python build possible, so it must be
# buildable before one is. The layout is where it puts what it provisions.
[dependencies]
goofi-supervisor = { path = "../goofi-supervisor" }
goofi-provision = { path = "../goofi-provision" }
# The setup screen, the one goofi draws its startup on.
goofi-screen = { path = "../goofi-screen" }

[[bin]]
name = "goofi-init"
path = "src/main.rs"
