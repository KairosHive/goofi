[package]
name = "goofi-graph"
version.workspace = true
edition.workspace = true
license.workspace = true

# The op authority for the MODEL. Never goofi-transport or an engine, so this manifest enforces
# that the graph never computes a service name or touches an endpoint.
[dependencies]
goofi-supervisor = { path = "../goofi-supervisor" }
goofi-core = { path = "../goofi-core" }
goofi-node = { path = "../goofi-node" }
# What a viewer asks of a producer, which `set_view_demand` carries to every engine.
goofi-view = { path = "../goofi-view" }
goofi-record = { path = "../goofi-record" }

indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
walkdir = "2"
# No default features: every entry is stamped 1980-01-01, so a repack does not differ, and
# `deflate-flate2-zlib-rs` selects a backend without zopfli.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ts-rs = { version = "12", features = ["serde-compat", "indexmap-impl", "serde-json-impl"] }
