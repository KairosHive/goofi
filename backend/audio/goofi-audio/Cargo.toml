[package]
name = "goofi-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# WASAPI publishes an interface as one stereo endpoint per pair the driver exposes, so a
# multi-input card is reachable past its first pair only through the driver's own ASIO view. cpal
# target-gates `asio-sys` to Windows, so this feature is INERT on Linux and macOS and costs a build
# there nothing. On Windows it needs libclang, which is what `goofi-init` asks for; it does NOT need
# a hand-supplied SDK, since asio-sys downloads the Steinberg one itself when `CPAL_ASIO_DIR` names
# no copy. What the SDK's licence still bars is a goofi BINARY someone else redistributes —
# `roadmap/audio-engine.md` carries that, and it is a question for a release, not for a build.
asio = ["cpal/asio"]

[dependencies]
goofi-core = { path = "../../goofi-core" }
goofi-node = { path = "../../goofi-node" }
goofi-codec = { path = "../../goofi-codec" }
goofi-transport = { path = "../../goofi-transport" }
goofi-control = { path = "../../goofi-control" }
goofi-window = { path = "../../goofi-window" }
goofi-audio-sdk = { path = "../goofi-audio-sdk", features = ["host"] }
goofi-build = { path = "../../goofi-build" }
indexmap = "2"
rtrb = "0.3"
# Every host cpal can build, so `available_hosts()` answers what the machine actually runs and the
# choice between them is the user's. cpal target-gates each one, so a feature named here that the
# platform has no host for costs nothing. `realtime` promotes the callback thread — MMCSS on
# Windows, rtkit on Linux, and rtkit is what `realtime-dbus` reaches.
cpal = { version = "0.18", features = ["pipewire", "pulseaudio", "jack", "realtime", "realtime-dbus"] }
midir = "0.11"
vst3 = "0.3.0"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
