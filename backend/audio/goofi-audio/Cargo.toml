[package]
name = "goofi-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# ASIO reaches a multi-input card past WASAPI's first stereo pair. Inert off Windows; on Windows it
# needs libclang (`goofi-init`) and asio-sys fetches the SDK. The licence: `roadmap/audio-engine.md`.
asio = ["cpal/asio"]

[dependencies]
goofi-supervisor = { path = "../../goofi-supervisor" }
goofi-core = { path = "../../goofi-core" }
goofi-node = { path = "../../goofi-node" }
goofi-codec = { path = "../../goofi-codec" }
goofi-transport = { path = "../../goofi-transport" }
goofi-runtime = { path = "../../goofi-runtime" }
goofi-window = { path = "../../goofi-window" }
goofi-audio-sdk = { path = "../goofi-audio-sdk", features = ["host"] }
goofi-build = { path = "../../goofi-build" }
indexmap = "2"
rtrb = "0.3"
# Every host cpal can build, so `available_hosts()` answers what the machine actually runs and the
# choice between them is the user's. cpal target-gates each one, so a feature named here that the
# platform has no host for costs nothing.
cpal = { version = "0.18", features = ["pipewire", "pulseaudio", "jack", "realtime", "realtime-dbus"] }
midir = "0.11"
vst3 = "0.3.0"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
