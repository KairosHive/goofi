# What a goofi runtime is made of, pinned by hand: a bump edits this file and nothing else.
# The interpreters are uv's spelling; each archive unpacks into `tools/<tool>/` with its first
# `strip` path segments dropped, so several archives can fill one tool.

[python]
ft = "3.14.6t"
gil = "3.12.13"

