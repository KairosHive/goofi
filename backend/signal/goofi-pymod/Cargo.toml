[package]
name = "goofi-pymod"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# NOT `goofi`: on Windows the bin of that name and this cdylib both emit `goofi.pdb` into one
# directory. `module-name` in pyproject.toml is what names the wheel's module.
name = "goofi_pymod"
# cdylib -> the importable extension (goofi.so, wheel); rlib -> linked into the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
goofi-core = { path = "../../goofi-core" }
indexmap = "2"
pyo3 = { version = "0.29", optional = true }
# serde<->PyObject: pythonizes the meta map to/from a Python dict (with pyo3, so gated).
pythonize = { version = "0.29", optional = true }
serde_json = "1"
# The `goofi.serve` subprocess child loop (wheel only): the shared request/response
# frame codec is shared with the host; iceoryx2 is used by the wheel only.
goofi-codec = { path = "../../goofi-codec", optional = true }
iceoryx2 = { version = "0.9.3", optional = true }

[features]
# Default build is python-free (empty crate) so `cargo build --workspace` needs no
# interpreter. The wheel build turns on extension-module (+ abi3, no libpython link);
# the host build turns on auto-initialize (links the FT interpreter directly).
default = []
extension-module = ["dep:pyo3", "dep:pythonize", "dep:goofi-codec", "dep:iceoryx2", "pyo3/extension-module", "pyo3/abi3-py38"]
host = ["dep:goofi-codec", "dep:pyo3", "dep:pythonize", "pyo3/auto-initialize"]
