[package]
name = "goofi-graphics-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The graphics engine in the browser: wasm-bindgen glue over goofi-graphics on WebGPU."

[lib]
crate-type = ["cdylib"]

[dependencies]
goofi-graphics = { path = "../goofi-graphics" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }
