[package]
name = "goofi-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
filedescriptor = "0.8.3"
indexmap = "2"
# A drawing widget's value is a `data:image/png;base64,…` URL and a node has to read the pixels out
# of it; `src/png.rs` is that door, and these are the two halves it does not hand-roll.
base64 = "0.22"
flate2 = "1"
# Canonicalisation WITHOUT the `\\?\` verbatim prefix that `std::fs::canonicalize` always returns
# on Windows — see `src/path.rs`. It keeps the prefix on the paths that genuinely need it (past
# MAX_PATH), which is the part a hand-rolled strip gets wrong.
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
# The config file's format.
toml = "0.8"
# The shared, payload-free ViewSpec algebra. goofi-core (signal payload) implements its
# `Reducible` seam for `Data` — the allowed signal→shared dependency direction; goofi-view
# never depends back on goofi-core.
goofi-view = { path = "../goofi-view" }

# The child's process group and the liveness pipe's fd flag (unix); the log redirect (windows).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Marking the liveness pipe's read HANDLE inheritable.
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
