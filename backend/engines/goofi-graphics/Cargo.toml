[package]
name = "goofi-graphics"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The 8-bit tap goes out as the GOOF frame it is.
bytes = "1"
goofi-supervisor = { path = "../../goofi-supervisor" }
goofi-sdk = { path = "../../goofi-sdk" }
goofi-core = { path = "../../goofi-core" }
goofi-codec = { path = "../../goofi-codec" }
goofi-transport = { path = "../../goofi-transport" }
goofi-runtime = { path = "../../goofi-runtime" }
goofi-window = { path = "../../goofi-window" }
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12", "std"] }
naga = { version = "30", features = ["wgsl-in"] }
pollster = "0.4"
half = "2"
serde = { version = "1", features = ["derive"] }

# A picture in memory the child of a node maps: the raw Vulkan buffer, and its descriptor's send.
[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
libc = "0.2"
