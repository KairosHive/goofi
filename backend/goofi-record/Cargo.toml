[package]
name = "goofi-record"
version.workspace = true
edition.workspace = true
license.workspace = true

# The recorder owns no engine and no engine owns it: the model types and the transport's queues.
[dependencies]
goofi-supervisor = { path = "../goofi-supervisor" }
goofi-core = { path = "../goofi-core" }
goofi-node = { path = "../goofi-node" }
goofi-transport = { path = "../goofi-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
