[package]
name = "goofi-supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
filedescriptor = "0.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
# The config file's format.
toml = "0.8"
# The child's process group and the liveness pipe's fd flag (unix); the log redirect (windows).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The liveness pipe's inheritable HANDLE, the timed wait on a child, and taking a DACL back.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
] }
