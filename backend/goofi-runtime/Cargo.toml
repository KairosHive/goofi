[package]
name = "goofi-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# The in-process Python tier, which LINKS libpython: `cargo run -p goofi-init` provisions it.
embed = ["dep:pyo3", "dep:goofi_pymod"]

[dependencies]
bytes = "1"
goofi-supervisor = { path = "../goofi-supervisor" }
goofi-core = { path = "../goofi-core" }
goofi-sdk = { path = "../goofi-sdk" }
goofi-build = { path = "../goofi-build" }
goofi-codec = { path = "../goofi-codec" }
goofi-transport = { path = "../goofi-transport" }
indexmap = "2"
libloading = "0.8"
serde_json = "1"
sha2 = "0.10"
goofi_pymod = { path = "../goofi-pymod", package = "goofi-pymod", features = ["host"], optional = true }
pyo3 = { version = "0.29", features = ["auto-initialize"], optional = true }
