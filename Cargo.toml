[workspace]
resolver = "2"
exclude = ["vendor/audio_thread_priority"]
members = [
    # First, because it is what makes the rest buildable: `cargo run -p goofi-init` provisions the
    # interpreters pyo3 links against. It depends on nothing, so it can never trigger that build.
    "backend/goofi-init",
    "backend/goofi-core",
    "backend/goofi-host-sdk",
    "backend/goofi-host",
    "backend/graphics/goofi-graphics-sdk",
    "backend/goofi-codec",
    "backend/goofi-node",
    "backend/goofi-transport",
    "backend/goofi-control",
    "backend/goofi-window",
    "backend/goofi-build",
    "backend/goofi-graph",
    "backend/goofi-record",
    "backend/signal/goofi-signal-sdk",
    "backend/audio/goofi-audio-sdk",
    "backend/audio/goofi-audio",
    "backend/graphics/goofi-graphics",
    "backend/graphics/goofi-graphics-web",
    "backend/signal/goofi-signal",
    "backend/signal/goofi-python",
    "backend/signal/goofi-pymod",
    "backend/goofi-view",
    "backend/goofi-bridge",
    "backend/goofi-client",
    "backend/goofi-cli",
    "backend/goofi-tests",
]

[workspace.package]
# THE version of goofi — the single source of truth. Every crate takes it via
# `version.workspace = true`, `mcp.rs` reports it through `env!("CARGO_PKG_VERSION")`, and the
# Python wheel derives it too (`goofi-pymod/pyproject.toml` declares the version `dynamic`, which
# is what makes maturin read it from here instead of restating it).
version = "3.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.89"

[profile.release]
lto = "thin"
codegen-units = 1

# A test binary links the whole tree; with full debug info each of seventy was 470 MB, a fresh
# target 24 GB, and CI ran out of disk. Workspace crates keep line tables; dependencies carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# A test target is a small crate against the big ones; its incremental cache is all cost.
[profile.test]
incremental = false

# The sound-server client zero-fills a 1 MB read buffer on every socket wakeup; unoptimized, that
# byte-by-byte fill alone pins a core, so a `cargo run` build cannot hold a stream in real time.
[profile.dev.package.pulseaudio]
opt-level = 3

# Device deadlines apply to development builds too; debug checks and symbols stay enabled.
[profile.dev.package.goofi-audio]
opt-level = 2

[patch.crates-io]
# Direct Linux scheduling must not install RTKit's process-wide CPU limit.
audio_thread_priority = { path = "vendor/audio_thread_priority" }
